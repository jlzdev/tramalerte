[platformio]
default_envs = esp32dev

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
build_src_filter = +<*>
lib_deps =
  zinggjm/GxEPD2@^1.6.4
  adafruit/Adafruit GFX Library@^1.12.1
  bblanchon/ArduinoJson@^7.4.2
  tzapu/WiFiManager@^2.0.17
  ricmoo/QRCode@^0.0.1

[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = tramalerte.local

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<depart.cpp>
build_flags = ${env.build_flags} -DNATIVE

[env:sim]
platform = native
build_src_filter = +<depart.cpp> +<dessin.cpp> +<../sim/*.cpp> +<../sim/adafruit_gfx/*.cpp>
build_flags = ${env.build_flags} -DNATIVE -DARDUINO=100 -Isim/stubs -Isim/adafruit_gfx -Isrc -Wno-unused-parameter
